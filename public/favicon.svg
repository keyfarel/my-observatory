<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <style>
        /* Default state (used by Google Search and Light Mode tabs): Dark Navy text */
        .k { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 85px; font-weight: bold; fill: #080B12; }
        .dot { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 85px; font-weight: bold; fill: #F4B860; }
        
        /* Adapt to Dark Mode tabs: White text */
        @media (prefers-color-scheme: dark) {
            .k { fill: #E8EDF2; }
        }
    </style>
    <!-- Transparent Background -->
    <text x="22" y="88" class="k">K</text>
    <text x="68" y="88" class="dot">.</text>
</svg>
